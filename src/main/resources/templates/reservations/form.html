<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Create Reservation</h1>

<form th:action="@{/reservations}" method="post" class="needs-validation">
    <div class="mb-3">
        <label>Passenger</label>
        <select name="passengerId" class="form-select" required>
            <option value="">-- Choose passenger --</option>
            <option th:each="p : ${passengers}" th:value="${p.id}"
                    th:text="${p.firstName + ' ' + p.lastName}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label>Flight</label>
        <select name="flightId" class="form-select" required>
            <option value="">-- Choose flight --</option>
            <option th:each="f : ${flights}" th:value="${f.id}"
                    th:text="${f.flightNumber + ' (' + f.destination + ')'}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label>Paid Amount</label>
        <input type="number" step="0.01" name="paidAmount" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a class="btn btn-secondary" th:href="@{/reservations}">Cancel</a>
</form>
</body>
</html>
