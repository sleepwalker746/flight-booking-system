<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Reservations</h1>

<form th:action="@{/reservations/search}" method="get" class="mb-3">
    <div class="input-group">
        <input type="number" name="reservationId" class="form-control"
               placeholder="Търси по номер на резервация" th:value="${reservationId}" />
        <button class="btn btn-outline-primary" type="submit">Търси</button>
    </div>
</form>

<a class="btn btn-primary mb-3" th:href="@{/reservations/new}">Add New Reservation</a>
<a class="btn btn-secondary mb-3" th:href="@{/}">Back</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>Code</th>
        <th>Passenger</th>
        <th>Flight</th>
        <th>Created</th>
        <th>Paid Amount</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${reservations}">
        <td th:text="${r.reservationCode}"></td>
        <td th:text="${r.passenger.firstName + ' ' + r.passenger.lastName}"></td>
        <td th:text="${r.flight.flightNumber}"></td>
        <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${r.paidAmount}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
