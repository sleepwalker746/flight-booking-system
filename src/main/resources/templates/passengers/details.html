<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passenger Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Passenger Details</h1>

<div th:if="${passenger != null}">
    <table class="table table-bordered">
        <tr><th>ID</th><td th:text="${passenger.id}"></td></tr>
        <tr><th>First Name</th><td th:text="${passenger.firstName}"></td></tr>
        <tr><th>Middle Name</th><td th:text="${passenger.middleName}"></td></tr>
        <tr><th>Last Name</th><td th:text="${passenger.lastName}"></td></tr>
        <tr><th>EGN</th><td th:text="${passenger.egn}"></td></tr>
        <tr><th>Address</th><td th:text="${passenger.address}"></td></tr>
        <tr><th>Phone</th><td th:text="${passenger.phone}"></td></tr>
        <tr><th>Passport</th><td th:text="${passenger.passportNumber}"></td></tr>
    </table>
</div>

<div th:if="${passenger == null}">
    <p class="text-danger">No passenger found for the given EGN.</p>
</div>

<a class="btn btn-secondary" th:href="@{/passengers}">Back</a>
</body>
</html>
