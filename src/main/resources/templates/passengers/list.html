<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passengers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Passengers</h1>

<form th:action="@{/passengers/search}" method="get" class="mb-3">
    <div class="input-group">
        <input type="text" name="name" class="form-control"
               placeholder="Търси по име на пътник" th:value="${name}" />
        <button class="btn btn-outline-primary" type="submit">Търси</button>
    </div>
</form>

<form th:action="@{/passengers/egn}" method="get" class="mb-3">
    <div class="input-group">
        <input type="text" name="egn" class="form-control"
               placeholder="Търси по ЕГН" />
        <button class="btn btn-outline-primary" type="submit">Търси</button>
    </div>
</form>


<a class="btn btn-primary mb-3" th:href="@{/passengers/new}">Add New Passenger</a>
<a class="btn btn-secondary mb-3" th:href="@{/}">Back</a>

<table class="table table-bordered table-striped align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Middle Name</th>
        <th>Last Name</th>
        <th>EGN</th>
        <th>Address</th>
        <th>Phone</th>
        <th>Passport</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${passengers}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.firstName}"></td>
        <td th:text="${p.middleName}"></td>
        <td th:text="${p.lastName}"></td>
        <td th:text="${p.egn}"></td>
        <td th:text="${p.address}"></td>
        <td th:text="${p.phone}"></td>
        <td th:text="${p.passportNumber}"></td>
        <td>
            <a th:href="@{'/passengers/delete/' + ${p.id}}" class="btn btn-sm btn-danger">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
