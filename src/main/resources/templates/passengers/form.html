<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Passenger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Add Passenger</h1>

<form th:action="@{/passengers}" th:object="${passenger}" method="post" class="needs-validation">
    <div class="row">
        <div class="col-md-4 mb-3">
            <label>First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control" required>
        </div>
        <div class="col-md-4 mb-3">
            <label>Middle Name</label>
            <input type="text" th:field="*{middleName}" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
            <label>Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control" required>
        </div>
    </div>

    <div class="mb-3">
        <label>EGN</label>
        <input type="text" th:field="*{egn}" class="form-control" minlength="10" maxlength="10" required>
        <div class="form-text">10 digits Bulgarian EGN</div>
    </div>

    <div class="mb-3">
        <label>Address</label>
        <input type="text" th:field="*{address}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text" th:field="*{phone}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Passport Number</label>
        <input type="text" th:field="*{passportNumber}" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a class="btn btn-secondary" th:href="@{/passengers}">Cancel</a>
</form>
</body>
</html>
