<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Flights</h1>

<form th:action="@{/flights/search}" method="get" class="mb-3">
    <div class="input-group">
        <input type="text" name="flightNumber" class="form-control"
               placeholder="Търси по номер на полет" th:value="${flightNumber}" />
        <button class="btn btn-outline-primary" type="submit">Търси</button>
    </div>
</form>

<a class="btn btn-primary mb-3" th:href="@{/flights/new}">Add New Flight</a>
<a class="btn btn-secondary mb-3" th:href="@{/}">Back</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Flight Number</th>
        <th>Airline</th>
        <th>Destination</th>
        <th>Departure</th>
        <th>Price</th>
        <th>Seats</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="flight : ${flights}">
        <td th:text="${flight.id}"></td>
        <td th:text="${flight.flightNumber}"></td>
        <td th:text="${flight.airline}"></td>
        <td th:text="${flight.destination}"></td>
        <td th:text="${#temporals.format(flight.departure, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${flight.price}"></td>
        <td th:text="${flight.totalSeats}"></td>
        <td>
            <a th:href="@{'/flights/delete/' + ${flight.id}}" class="btn btn-sm btn-danger">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
