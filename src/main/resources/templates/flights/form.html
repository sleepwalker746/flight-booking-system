<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Flight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Add Flight</h1>

<form th:action="@{/flights}" th:object="${flight}" method="post" class="needs-validation">
    <div class="mb-3">
        <label>Flight Number</label>
        <input type="text" th:field="*{flightNumber}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Airline</label>
        <input type="text" th:field="*{airline}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Destination</label>
        <input type="text" th:field="*{destination}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Departure</label>
        <input type="datetime-local" th:field="*{departure}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Price</label>
        <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Total Seats</label>
        <input type="number" th:field="*{totalSeats}" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a class="btn btn-secondary" th:href="@{/flights}">Cancel</a>
</form>
</body>
</html>
